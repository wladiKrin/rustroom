# ⚠ M10.15a: on macOS, `cargo run` signs the Rustroom binary with the local "Rustroom Dev" identity —
# see scripts/macos-run.sh, and why a rebuild still asks for the password once. It changes nothing for
# a test or an example binary, nor anywhere the identity is absent.
[target.aarch64-apple-darwin]
runner = "scripts/macos-run.sh"

[target.x86_64-apple-darwin]
runner = "scripts/macos-run.sh"

# ⚠ v0.1 (piece 3a): on Windows the C++ runtime is linked INTO the exe, so it runs on a machine without Microsoft's
# redistributable and the installer never needs an admin prompt for it. Every C dependency is built through `cc`,
# which follows this; libheif comes from vcpkg's matching `x64-windows-static` triplet (CONTRIBUTING.md). A `RUSTFLAGS`
# environment variable REPLACES this — the build then asks vcpkg for the `-static-md` triplet instead.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
