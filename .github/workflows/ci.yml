name: CI
on:
  push:
  pull_request:
env:
  # ⚠ Disk, not speed: `cargo test --all` filled the runner's ~14 GB on 2026-09-21 ("No space
  # left on device" while compiling `pipeline`'s tests; the linker then died with a bus error).
  # A debug build of this workspace with full debug info and incremental artifacts is ~80 GB on
  # a developer machine. Line tables keep backtraces readable at a fraction of the size, and
  # CI never rebuilds incrementally anyway.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner image ships .NET, Android, Haskell and CodeQL toolchains this build never
      # touches — about 25 GB. Removing them is the other half of the disk fix.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # cmake and libde265-dev: clippy's `--all-features` compiles the AppImage's own libheif (`app`'s `appimage`).
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libraw-dev liblcms2-dev libgphoto2-dev libheif-dev libheif-plugin-libde265 pkg-config cmake libde265-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all
      - name: Test
        run: cargo test --all
      - name: Disk after
        if: always()
        run: df -h / && du -sh target || true

  # ⚠ v0.1: nothing else builds Windows, and the Linux build was once broken for four weeks unseen. This keeps it
  # compiling and linking — clippy and a build only: Windows minutes count double on a private repository, and the
  # tests run on the author's Windows machine. LLVM (libclang, for bindgen) comes with the runner image.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # `libheif-sys` reads libheif from vcpkg on MSVC, unconditionally: the runner's own vcpkg, decoder only, built
      # with the static C runtime the workspace links (`.cargo/config.toml`; CONTRIBUTING.md). The key is fixed, so a
      # newer runner vcpkg rebuilds it until the key is bumped.
      - name: Point the vcpkg crate at the runner's vcpkg
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-libheif-x64-windows-static-v1
      - name: Install libheif
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif[core,libde265]:x64-windows-static"'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all
