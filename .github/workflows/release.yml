name: Release
# v0.1 (piece 3a): a `v*` tag builds every package and opens a DRAFT GitHub release with them and SHA256SUMS — the
# author publishes it. A manual run (Actions → Release → Run workflow) builds the same packages without a release, to
# try the workflow without tagging. Each package is built by its own script under `packaging/`, which a local build
# runs too — never a second recipe here. `windows` (3a), `macos` (3b) and `linux` (3c) each build one package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
jobs:
  version:
    # ⚠ The tag must be the app's version — v0.1.0 for 0.1.0 — or nothing is built.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "app") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not the app's version, v$version"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # libheif from the runner's own vcpkg, decoder only, with the static C runtime (`.cargo/config.toml`).
      - name: Point the vcpkg crate at the runner's vcpkg
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-libheif-x64-windows-static-v1
      - name: Install libheif
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif[core,libde265]:x64-windows-static"'
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli
      - name: Build the installer
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/installer/Rustroom-*-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    # v0.1 (piece 3b): Apple Silicon, built from Homebrew's macOS 15 libraries — the app's floor. `--floor 15.0` fails
    # the build the day Homebrew stops building for macOS 15, rather than shipping an app that will not open there.
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install the libraries
        run: brew install little-cms2 libheif libgphoto2 pkgconf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli
      - name: Build the disk image
        run: packaging/macos/build.sh --floor 15.0
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/macos/Rustroom-*-macos-arm64.dmg
          if-no-files-found: error

  linux:
    # v0.1 (piece 3c): the AppImage, built on Ubuntu 22.04 — its glibc, 2.35, is the floor, and `--floor 2.35` fails
    # the build if anything bundled asks for more. ⚠ Inside packaging/linux/in-docker.sh's container, never on the
    # runner itself: libheif-sys links every codec cmake finds, and the runner image's preinstalled -dev packages put
    # OpenJPEG into the first release run (2026-11-20, stopped by build.sh's licence map). The container holds
    # deps.txt and nothing else — the same image a local build uses.
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/linux-docker/target"
          cache-directories: target/linux-docker/cargo-home
      - name: Build the AppImage
        run: packaging/linux/in-docker.sh --floor 2.35
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/linux/Rustroom-*-linux-x86_64.AppImage
            target/linux/Rustroom-*-linux-x86_64.AppImage.zsync
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --draft --generate-notes \
            --title "Rustroom $VERSION" --repo "$GITHUB_REPOSITORY"
