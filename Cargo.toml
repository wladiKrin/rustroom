[workspace]
resolver = "2"
members = [
    "crates/ai-mask",
    "crates/core-image",
    "crates/raw-decode",
    "crates/color",
    "crates/edit-model",
    "crates/pipeline",
    "crates/gpu-pipeline",
    "crates/export",
    "crates/rustroom",
    "crates/app",
    "crates/camera-profile",
    "crates/catalog",
    "crates/image-decode",
    "crates/immich",
    "crates/lens-profile",
    "crates/lr-preset",
    "crates/photo-merge",
    "crates/test-dir",
    "crates/tether",
    "crates/xmp",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/wladiKrin/rustroom"

# ⚠⚠ **Measured 2026-09-23, and it is not what it looks like.** `target/debug` had reached
# **85 GB across 2.39 million files** on a volume at 88% full. A *warm* `cargo test --workspace`
# is **1 s** — fingerprinting that tree is not slow. But anything **cold** cost minutes: the first
# run of the test binaries after a build took **437 s with zero compiles**, and `ls`/`du` on
# `target/debug/deps` exceeded a two-minute timeout. The cost is filesystem work on a tree that
# should never have got that big.
#
# ⚠ `line-tables-only` keeps file and line numbers in panics and backtraces — which is what this
# project actually reads — and drops the variable-level DWARF a step debugger would want. Set it
# back to `true` for a session where you need to inspect locals in a debugger; the cost is the tree
# growing again.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["tiff", "jpeg", "png", "webp"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
eframe = { version = "0.35", features = ["wgpu"] }
egui = "0.35"
rfd = "0.17"
rayon = "1"
lcms2 = "6"
# ⚠ Already in the tree via eframe — declared here so `gpu-pipeline` pins the same versions the
# app's own renderer uses. Two wgpu versions in one process is not a situation to discover later.
wgpu = "29"
pollster = "0.4"
bytemuck = "1"
quick-xml = "0.41"
ureq = "3"
