[workspace]
resolver = "2"
members = [
    "crates/core-image",
    "crates/raw-decode",
    "crates/color",
    "crates/edit-model",
    "crates/pipeline",
    "crates/export",
    "crates/rustroom",
    "crates/app",
    "crates/catalog",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/wladiKrin/rustroom"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["tiff", "jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.35", features = ["wgpu"] }
egui = "0.35"
rfd = "0.17"
