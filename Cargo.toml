[workspace]
resolver = "2"
members = [
    "crates/core-image",
    "crates/raw-decode",
    "crates/color",
    "crates/edit-model",
    "crates/pipeline",
    "crates/gpu-pipeline",
    "crates/export",
    "crates/rustroom",
    "crates/app",
    "crates/camera-profile",
    "crates/catalog",
    "crates/image-decode",
    "crates/immich",
    "crates/lens-profile",
    "crates/xmp",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/wladiKrin/rustroom"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["tiff", "jpeg", "png", "webp"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
eframe = { version = "0.35", features = ["wgpu"] }
egui = "0.35"
rfd = "0.17"
rayon = "1"
lcms2 = "6"
# ⚠ Already in the tree via eframe — declared here so `gpu-pipeline` pins the same versions the
# app's own renderer uses. Two wgpu versions in one process is not a situation to discover later.
wgpu = "29"
pollster = "0.4"
bytemuck = "1"
quick-xml = "0.41"
ureq = "3"
