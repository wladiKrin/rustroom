[package]
name = "app"
version = "0.1.1"
edition.workspace = true
license.workspace = true

[lib]
name = "rustroom_app"
path = "src/lib.rs"

# ⚠ The binary name is what macOS shows as the application menu's title: an unbundled
# executable has no CFBundleName, so AppKit falls back to the process name. It read
# "rustroom-gui" until this was capitalised.
[[bin]]
name = "Rustroom"
path = "src/main.rs"

# ⚠ M10.18a: real cameras need the system's libgphoto2 (`pacman -S libgphoto2`, `apt install
# libgphoto2-dev`, `brew install libgphoto2`). Without the feature, Tethered capture says so.
[features]
default = ["camera"]
camera = ["tether/gphoto2"]
# v0.1 (piece 3c): the AppImage's build — libheif compiled in (`image-decode`'s `embedded-libheif`).
appimage = ["image-decode/embedded-libheif"]

[dependencies]
camera-profile = { path = "../camera-profile" }
color = { path = "../color" }
raw-window-handle = "0.6"
core-image = { path = "../core-image" }
raw-decode = { path = "../raw-decode" }
edit-model = { path = "../edit-model" }
pipeline = { path = "../pipeline" }
gpu-pipeline = { path = "../gpu-pipeline" }
lens-profile = { path = "../lens-profile" }
export = { path = "../export" }
catalog = { path = "../catalog" }
xmp = { path = "../xmp" }
lr-preset = { path = "../lr-preset" }
image-decode = { path = "../image-decode" }
immich = { path = "../immich" }
ai-mask = { path = "../ai-mask" }
photo-merge = { path = "../photo-merge" }
tether = { path = "../tether" }
# M10.18b: the Map's tiles and place search — already in the tree through `immich` and `ai-mask`.
ureq = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
chrono = "0.4.45"
# ⚠ M10.15a: the Immich keys in the OS credential store. The default `v1` feature is macOS Keychain,
# Windows Credential Manager and a pure-Rust (zbus) Secret Service — no libdbus on Linux.
keyring = "4.2"
rayon.workspace = true
# ⚠ Was a dev-dependency until M8.2. `thumb_store` encodes the cache payload as JPEG, which is
# production code, so it moved up. No new crate enters the tree: `image` is already a dependency
# of `export`, `image-decode` and `raw-decode`, and a regular dependency is available to the
# tests and examples that previously relied on the dev entry.
image = { workspace = true }
# ⚠ M10.16b: AI denoise's cache file — half-floats, deflated. Both already in the build (`half` through
# wgpu's `naga`, `flate2` through `lensfun` — `cargo tree -i`), so no new crate is compiled.
half = "2.7"
flate2 = "1.1"

# v0.1: the Windows exe's icon and version information, compiled in by `build.rs` (it runs `rc.exe` from the
# Windows SDK, which the C++ Build Tools install).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Piece 4 goal 2: the Store package's identity (`GetCurrentPackageFullName`) silences the update notice — see
# `update_check::updated_elsewhere`. Already in the tree (`cargo tree -i windows-sys@0.61.2`), so no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx"] }

# ⚠ macOS only, on purpose: muda's Linux backend needs GTK, which eframe/winit does not
# provide. Linux CI therefore never builds it — see `native_menu.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19"
# Only to suppress the items AppKit injects into any menu titled "Edit" — see
# `native_menu::suppress_injected_edit_items`. Already in the tree via muda.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSDictionary",
    "NSUserDefaults",
] }
# Tagging the window's Metal layer as sRGB, so Core Animation colour-matches the preview to the
# display's own profile — see `display_colorspace.rs`.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSView",
    "NSResponder",
    "objc2-quartz-core",
    # For `native_menu::strip_injected_items` — the same features muda already enables, so
    # nothing new compiles.
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSWindow",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColorSpace",
] }

[dev-dependencies]
# M10.14 audit: a GPU path that silently falls back to the CPU fails a test rather than passing it.
gpu-pipeline = { path = "../gpu-pipeline", features = ["strict-fallback"] }
# The constructed panoramas for the panorama merge's tests.
photo-merge = { path = "../photo-merge", features = ["testing"] }
# The scripted camera for the tethering flow's tests.
tether = { path = "../tether", features = ["testing"] }
# M10.7c: every test directory comes from here — unique per test and per run, and cleaned up.
test-dir = { path = "../test-dir" }
# For examples that stand up their own wgpu device (probe_gpu_contention).
pollster = { workspace = true }
# For `theme::no_bundled_font_shadows_an_icon`: the fonts' real cmap tables, not egui's
# face resolution (which cannot answer for a single-font stack). Already in the tree through
# epaint's shaper, same version, so nothing new compiles.
read-fonts = "0.39"
