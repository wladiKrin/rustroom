[package]
name = "gpu-pipeline"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# ⚠⚠ This crate depends on `pipeline`; NOTHING depends on this crate. That direction is the whole
# point: `pipeline`, `rustroom` (the CLI), `export` and the 63 goldens gain no wgpu, and the
# `PipelineStage` trait stays the seam it was designed as.
[dependencies]
core-image = { path = "../core-image" }
pipeline = { path = "../pipeline" }
color = { path = "../color" }
edit-model = { path = "../edit-model" }
lens-profile = { path = "../lens-profile" }
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
# M10.16b5: DRUNet's f16 storage, packed on the CPU (already in the build through naga).
half = "2.7"

[features]
# M10.14 audit: a GPU run that falls back to the CPU PANICS — for the app's tests, which enable it as a
# dev-dependency feature, so no build of the app itself carries it. This crate's own tests have it always.
strict-fallback = []
