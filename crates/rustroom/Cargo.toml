[package]
name = "rustroom"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# ⚠ Not `rustroom`: the GUI's binary is `Rustroom`, and on macOS's case-insensitive disk the two are ONE file
# in `target/` — the last built won, and `rustroom render` opened the GUI (2026-10-20). The package keeps its
# name, so `cargo run -p rustroom -- render …` is unchanged; `test-dir` guards the rule.
[[bin]]
name = "rustroom-cli"
path = "src/main.rs"

[dependencies]
color = { path = "../color" }
core-image = { path = "../core-image" }
raw-decode = { path = "../raw-decode" }
pipeline = { path = "../pipeline" }
lens-profile = { path = "../lens-profile" }
edit-model = { path = "../edit-model" }
export = { path = "../export" }
photo-merge = { path = "../photo-merge" }
anyhow.workspace = true
clap.workspace = true
image.workspace = true
