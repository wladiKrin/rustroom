[package]
name = "tether"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Tethered capture (M10.18a): a camera on USB, each new shot downloaded as it is taken. ⚠ Zero GUI —
# the app's flow drives a `Session` through channels.
[features]
# The scripted camera (`fake::Fake`) for other crates' tests.
testing = []
# The real cameras, through the system's libgphoto2 (LGPL-2.1).
gphoto2 = ["dep:gphoto2"]

# ⚠ v0.1: not on Windows, where libgphoto2 has no build — the feature is then a no-op, so a default build (and CI's
# `--all-features`) still compiles there. The code is gated on `all(feature = "gphoto2", not(windows))`.
[target.'cfg(not(windows))'.dependencies]
gphoto2 = { version = "3.4", optional = true }

[dev-dependencies]
test-dir = { path = "../test-dir" }
